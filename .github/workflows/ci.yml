name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test --no-parallel

      - name: Render the boards (catalog, collections, exercises, bubbles)
        run: swift run Hopla --render renders

      - name: Self-test in the real panel
        timeout-minutes: 3
        run: swift run Hopla --selftest selftest

      - name: Upload boards
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boards
          path: |
            renders
            selftest
